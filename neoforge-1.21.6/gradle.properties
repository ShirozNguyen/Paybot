architectury.platform=neoforge
loom.platform=neoforge

# v5.5.5 Part 44: neoforge-modern — MC 1.20.2 - 1.21.11. Biên dịch nhắm ĐÚNG 1.21.1 —
# khớp NGUYÊN VĂN log Shiroz gửi ("NeoForge mod loading, version 21.1.248, for MC 1.21.1").
# NeoForge đổi coordinate Maven từ "net.neoforged:forge" (chỉ dùng cho 1.20.1) sang
# "net.neoforged:neoforge" từ 1.20.2 trở đi — Architectury Loom dùng config `neoForge`
# (chữ F hoa) riêng cho coordinate mới này (khác `forge` dùng cho module forge-legacy/forge-modern).
minecraft_version = 1.21.6
neoforge_version = 21.6.1-beta

# v5.5.5 Part 44e: neoforge_version NÀY LÀ ƯỚC TÍNH theo đúng QUY LUẬT versioning
# NeoForge (<mc_minor>.<mc_patch>.<build>-beta, build=1 vì bản mới ra thường bắt đầu
# từ build 1) — không tìm được số build chính xác mới nhất. Nếu 'gradlew build' báo
# lỗi 'could not find neoforge:21.6.1-beta', vào https://projects.neoforged.net/neoforged/neoforge
# chọn đúng MC 1.21.6, lấy số build thật và sửa lại dòng neoforge_version (chỉ 1 dòng).
