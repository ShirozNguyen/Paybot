plugins {
    id 'dev.architectury.loom' version '1.9.436'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java'
}

// PayBot v5.5.5 Part 64: module này giờ là project Gradle HOÀN TOÀN ĐỘC LẬP (xem
// settings.gradle cùng thư mục) — KHÔNG còn nằm trong allprojects{} của root build.gradle
// nữa, nên PHẢI tự khai lại version/group/repositories/toolchain/dependencies{minecraft}
// y hệt logic root (trước đây thừa hưởng tự động qua allprojects{}). Xem LOG.md Part 64.
version = '5.5.5'
group = 'com.naptien'

repositories {
    mavenCentral()
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

base {
    archivesName = "PayBot-Mod-Fabric-1.21.2"
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = true
    }
    compileClasspath.extendsFrom shadowBundle
    runtimeClasspath.extendsFrom shadowBundle
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Direct shaded libraries for Fabric & Quilt
    shadowBundle 'org.xerial:sqlite-jdbc:3.45.3.0'
    shadowBundle 'com.mysql:mysql-connector-j:8.4.0'
    shadowBundle 'com.zaxxer:HikariCP:5.1.0'
    shadowBundle 'org.yaml:snakeyaml:2.2'
    shadowBundle 'com.google.zxing:core:3.5.3'
    shadowBundle 'com.google.zxing:javase:3.5.3'
    shadowBundle 'org.nanohttpd:nanohttpd:2.3.1'
}

processResources {
    inputs.property "version", project.version

    filesMatching(["fabric.mod.json", "quilt.mod.json"]) {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"
    // v5.5.5 Part 44: loại trừ slf4j đóng gói theo HikariCP (xem giải thích ở fabric-legacy)
    exclude "org/slf4j/**"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}
