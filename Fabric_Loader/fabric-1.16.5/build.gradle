plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

base {
    archivesName = "PayBot-Mod-Fabric-1.16.5"
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = true
    }
    compileClasspath.extendsFrom shadowBundle
    runtimeClasspath.extendsFrom shadowBundle
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Direct shaded libraries for Fabric & Quilt
    shadowBundle 'org.xerial:sqlite-jdbc:3.45.3.0'
    shadowBundle 'com.mysql:mysql-connector-j:8.4.0'
    shadowBundle 'com.zaxxer:HikariCP:5.1.0'
    shadowBundle 'org.yaml:snakeyaml:2.2'
    shadowBundle 'com.google.zxing:core:3.5.3'
    shadowBundle 'com.google.zxing:javase:3.5.3'
    shadowBundle 'org.nanohttpd:nanohttpd:2.3.1'
    // MC 1.16.5 chưa có sẵn slf4j trên classpath runtime (chỉ có log4j2), cần shade slf4j-api + log4j binding
    shadowBundle 'org.slf4j:slf4j-api:1.7.36'
    shadowBundle 'org.apache.logging.log4j:log4j-slf4j-impl:2.14.1'
}

processResources {
    inputs.property "version", project.version

    filesMatching(["fabric.mod.json", "quilt.mod.json"]) {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"
    // v5.5.15 Part 132: MC 1.16.5 không có sẵn slf4j, không được exclude org/slf4j/** để mod không bị crash NoClassDefFoundError


    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"

    // FastStats Telemetry Subsystem (Fabric & Quilt)
    modImplementation 'dev.faststats.metrics:fabric:0.30.2+mc1.16.1-1.17.1'
    include 'dev.faststats.metrics:fabric:0.30.2+mc1.16.1-1.17.1'
}