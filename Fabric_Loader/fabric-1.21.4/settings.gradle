// PayBot v5.5.5 Part 64 — project Gradle HOÀN TOÀN ĐỘC LẬP cho fabric-1.21.4 (cùng mô hình Part 63).
// Lý do tách: dev.architectury.loom 1.10.455 (Architectury Loom) bắt buộc cho MC 1.21.4 —
// KHÁC với dev.architectury.loom 1.7.435 dùng chung ở root PayBot (chỉ đủ cho MC 1.21/1.21.1).
// Lỗi thật đã xảy ra ở fabric-1.21.5: "Mod was built with a newer version of Loom (1.10.1),
// you are using Loom (1.7.435)" — xác nhận qua fabricmc.net blog chính thức + mvnrepository.com.
// File này KHÔNG được include()/includeBuild() từ root — chỉ build bằng cách tự chạy
// './gradlew build' TỪ ĐÚNG THƯ MỤC NÀY (CI gọi 'cd fabric-1.21.4 && ./gradlew build').
pluginManagement {
    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'fabric-1.21.4'
