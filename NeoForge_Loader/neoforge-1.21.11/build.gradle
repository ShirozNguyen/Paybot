// neoforge-1.21.11/build.gradle — v5.5.5 Part 107
// Chuyển sang plugin chính thức net.neoforged.moddev (ModDevGradle) 2.0.141
// Do NeoForge 21.11 không có data/server.lzma trong installer nên Loom cũ bị crash NoSuchFileException.

plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'java'
}

version = '5.5.7'
group = 'com.paybot'

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

base {
    archivesName = "PayBot-Mod-NeoForge-1.21.11"
}

neoForge {
    version = project.neoforge_version
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = true
    }
    compileClasspath.extendsFrom shadowBundle
    runtimeClasspath.extendsFrom shadowBundle
}

dependencies {
    // Thư viện shaded trực tiếp
    shadowBundle 'org.xerial:sqlite-jdbc:3.45.3.0'
    shadowBundle 'com.mysql:mysql-connector-j:8.4.0'
    shadowBundle 'com.zaxxer:HikariCP:5.1.0'
    shadowBundle 'org.yaml:snakeyaml:2.2'
    shadowBundle 'com.google.zxing:core:3.5.3'
    shadowBundle 'com.google.zxing:javase:3.5.3'
    shadowBundle 'org.nanohttpd:nanohttpd:2.3.1'
}

processResources {
    inputs.property "version", project.version

    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand "version": project.version
    }
}

jar {
    archiveClassifier = null
    from {
        configurations.shadowBundle.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude "architectury.common.json"
    exclude "org/slf4j/**"
}

tasks.named("assemble") {
    dependsOn jar
}
