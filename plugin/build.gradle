plugins {
    id 'java'
}

group = rootProject.mod_group
version = rootProject.mod_version

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://oss.sonatype.org/content/groups/public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven {
        name = 'faststatsReleases'
        url = 'https://repo.faststats.dev/releases'
    }
}

configurations {
    faststatsBundle {
        canBeResolved = true
        canBeConsumed = true
    }
    implementation.extendsFrom faststatsBundle
}

dependencies {
    // ── Compile-only: Paper cung cấp tại runtime ─────────────────────────────
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // ── Compile-only: Paper tự tải qua plugin.yml libraries khi server start ─
    compileOnly 'org.xerial:sqlite-jdbc:3.45.3.0'
    compileOnly 'com.mysql:mysql-connector-j:8.4.0'
    compileOnly 'com.zaxxer:HikariCP:5.1.0'
    compileOnly 'com.google.code.gson:gson:2.11.0'
    compileOnly 'org.nanohttpd:nanohttpd:2.3.1'
    compileOnly 'org.yaml:snakeyaml:2.3'
    compileOnly 'com.google.zxing:core:3.5.3'
    compileOnly 'com.google.zxing:javase:3.5.3'

    // ── FastStats Telemetry Bundled Artifacts (Strategy A) ────────────────────
    faststatsBundle 'dev.faststats.metrics:bukkit:0.30.2'
    faststatsBundle 'dev.faststats.metrics:core:0.30.2'
    faststatsBundle 'dev.faststats.metrics:config:0.30.2'
}

processResources {
    inputs.property "version", project.version

    filesMatching("plugin.yml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveFileName = "PayBot-Plugin-${version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.faststatsBundle.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "META-INF/MANIFEST.MF"
        exclude "module-info.class"
    }
}
