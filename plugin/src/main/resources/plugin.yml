name: PayBot
version: ${version}
main: com.paybot.PayBotPlugin
api-version: "1.13"
folia-supported: true
description: "PayBot - Hệ thống nạp thẻ cào + ngân hàng tích hợp Discord Bot và SePay"
authors:
  - TheRealShiroz
website: "https://modrinth.com/plugin/paybot"

depend: []
softdepend: ["PlaceholderAPI"]

# Paper/Purpur/Folia tự tải các thư viện này từ Maven Central khi server start
# Giúp plugin JAR gọn nhẹ, không cần bundle vào file
libraries:
  - org.xerial:sqlite-jdbc:3.45.3.0
  - com.zaxxer:HikariCP:5.1.0
  - org.nanohttpd:nanohttpd:2.3.1
  - com.google.zxing:core:3.5.3
  - com.google.zxing:javase:3.5.3
  - com.mysql:mysql-connector-j:8.4.0

commands:
  napthe:
    description: "Nạp thẻ cào vào game (mở UI)"
    usage: "/napthe"
    permission: naptien.use

  napbank:
    description: "Nạp tiền qua ngân hàng (mở UI)"
    usage: "/napbank"
    permission: naptien.use

  ok:
    description: "Xác nhận nạp thẻ sau khi đã nhập thông tin"
    usage: "/ok"
    permission: naptien.use

  paybot:
    description: "Trung tâm quản trị & cài đặt PayBot (mở Master Setup Hub hoặc reload)"
    usage: "/paybot [setup|reload]"
    permission: naptien.admin
    aliases: ["paybotreload", "naptienreload"]

  paybotowner:
    description: "Đăng nhập quyền owner bằng mã một lần từ Discord"
    usage: "/paybotowner <mã> | logout | status"
    permission: naptien.use

  rewardclaim:
    description: "Nhận phần thưởng đang chờ (đơn được duyệt lúc bạn offline)"
    usage: "/rewardclaim [confirm]"
    permission: naptien.use

  paybotleaderboard:
    description: "[ADMIN ONLY] Xem thống kê nạp (tổng nạp, top nạp) - không cần PlaceholderAPI"
    usage: "/paybotleaderboard"
    permission: naptien.admin

permissions:
  naptien.use:
    description: "Cho phép dùng /napthe, /napbank, /ok, /paybotowner, /rewardclaim"
    default: true

  naptien.admin:
    description: "Quyền admin đầy đủ (cấu hình /paybot, xem /paybotleaderboard)"
    default: op

  naptien.op:
    description: "Quyền xem thông tin mua plugin"
    default: op
