# ── Reward Multiplier ─────────────────────────────────────────────────────────
# Hệ số nhân số lần thực thi bộ lệnh thưởng khi nạp thành công:
#   1 = mặc định (gửi 1 lần bộ lệnh thưởng)
#   2 = nhân đôi (gửi 2 lần bộ lệnh thưởng đã cấu hình), 3 = nhân ba, v.v.
# Chỉ nhập số nguyên >= 1 (vd: 1, 2, 3... hoặc 2x). Nếu nhập số lẻ (vd 2.2) sẽ tự làm tròn thành số nguyên gần nhất (2).
Rewards_Card_Mode: 1
Rewards_Bank_Mode: 1

# ── Reward Effects ────────────────────────────────────────────────────────────
# Hiệu ứng khi player nạp thành công
Reward_Firework: true # Bắn 2 quả pháo hoa (cách nhau 2s)
Reward_Sound: true # Sound level-up (<100k) hoặc Epic Achievement (>=100k)
Reward_Notification: true # Hiện dòng chữ xanh in đậm italic

