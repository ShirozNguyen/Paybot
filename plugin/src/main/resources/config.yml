# ─────────────────────────────────────────────────────────────────────────────
# PayBot Plugin Configuration  v5.0.0
# ─────────────────────────────────────────────────────────────────────────────

# ── Debug Mode ─────────────────────────────────────────────────────────────
# Khi bật (true): in TOÀN BỘ log lỗi/warning chi tiết (bao gồm nguyên nhân cụ thể
# của các lỗi trước đây bị bỏ qua âm thầm — ví dụ lỗi kết nối tới web thứ 3/SePay,
# lỗi phân tích cấu hình...) thay vì im lặng bỏ qua như mặc định.
# Mặc định: false (TẮT). Khuyến nghị chỉ bật khi đang tự debug/tìm lỗi — bật liên
# tục trên server production có thể làm log phình to nhanh nếu mạng hay chập chờn.
# Đổi runtime không cần restart: dùng lệnh /paybot reload sau khi sửa giá trị này.
debug-mode: false

# ── Loại Database ─────────────────────────────────────────────────────────────
# Chọn loại database: "SQLite" hoặc "MySQL" (hoa thường đều được).
# Mặc định: SQLite (chỉ dùng file local, không kết nối mạng).
# Khi dùng MySQL: Cấu hình thông tin kết nối MySQL ngay bên dưới tại phần "mysql:".
# QUAN TRỌNG: Nếu chọn "MySQL" mà không kết nối được → plugin tự tắt ngay lập tức.
database-type: SQLite

# ── Cấu hình MySQL (Chỉ được kích hoạt khi database-type là "MySQL") ──────────
mysql:
  host: "localhost"
  port: 3306
  database: "paybot"
  username: "root"
  password: ""
  useSSL: false
  pool-size: 10

# ── Connection ────────────────────────────────────────────────────────────────
# server-id và guild-id được tự động điền khi kết nối bot
# không được tự set nếu k bt gì, cần thì ib admin
# https://guns.lol/therealshiroz

server-id: ''
guild-id: ''
bot-url: ''


# v5.0.3: bỏ ngrok — plugin tự dò IP thật của server này (PublicIpResolver) nếu để trống.
# Chỉ set thủ công nếu server này ở sau NAT/router cần port-forward riêng.
plugin-callback-url: ''

# v5.0.3: tự đồng bộ config.yml mỗi 10s — tự thêm key/comment thiếu, tự xoá key thừa
# không còn tác dụng (từ bản cũ để lại), tự reload khi có gì thay đổi (do bot push
# bot-url mới, do admin tự sửa tay, hay do upgrade version). Tắt nếu đang tự debug
# config thủ công và không muốn bị tự động ghi đè.
auto-config-sync: true

# Fingerprint cert HTTPS của bot (TOFU — tự lưu lần đầu kết nối, đừng tự sửa tay trừ
# khi biết chắc đang làm gì). Xem BotHttpClient.java để hiểu cơ chế.
bot-cert-fingerprint: ''
# true = từ chối thẳng nếu cert bot đổi mà không khớp fingerprint đã lưu (an toàn hơn,
# phòng MITM, nhưng phải tự xoá bot-cert-fingerprint ở trên nếu đổi VPS thật).
# false (mặc định) = chỉ cảnh báo, vẫn cho qua và tự cập nhật fingerprint mới.
bot-cert-strict-pin: false

# Port HTTP server của plugin nhận SePay webhook và lệnh từ bot.
# v5.0.0 FIX: đổi default 25565 → 25580 (25565 TRÙNG port chơi Minecraft mặc định,
# khiến HTTP server của plugin bind thất bại ngay từ đầu trên mọi server chưa từng
# tự đổi port này — SePay IPN/push reward/push config từ bot ĐỀU không hoạt động được
# mà không có cảnh báo rõ ràng). Đổi nếu có xung đột hoặc host yêu cầu port khác.
plugin-port: 25580

# ── Mẫu ảnh VietQR ─────────────────────────────────────────────────────────────
# Tùy chọn kiểu dáng ảnh QR VietQR khi nạp ngân hàng.
# Mặc định: "qr_only" (chỉ QR thuần, nét nhất, không có khung viền).
# Các lựa chọn khác của VietQR.io: "compact" (QR + STK thu nhỏ), "compact2" (QR + STK + Logo), "print" (khung in đầy đủ).
vietqr-template: qr_only

# ── Nội dung chuyển khoản (mã đơn nạp bank) ───────────────────────────────────
# Tùy biến định dạng mã chuyển khoản (ví dụ "NT123456789012" hoặc "NAP_123456789012").
# Hệ thống tự động kiểm tra chống trùng đơn vĩnh viễn (đối chiếu cả cache và CSDL) —
# nếu mã ngẫu nhiên vừa tạo đã từng xuất hiện trong quá khứ, plugin tự tạo lại mã mới.
transfer-content:
  # Tiền tố mã nạp (2-5 chữ cái, tự viết HOA khi tạo, vd "NT" hoặc "NAP").
  prefix: NT
  # true = có dấu "_" nối giữa tiền tố và số (vd "NT_123456789012"). false = nối liền (vd "NT123456789012").
  require-underscore: false
  # true = tự động chèn ngày hiện tại (dMyyyy, vd 2272026 ngày 22/7/2026) vào ngay sau tiền tố (vd "NT2272026123456789012").
  # false = không chèn ngày (MẶC ĐỊNH).
  include-date-prefix: false
  # true = (MẶC ĐỊNH - An toàn tuyệt đối) Kiểm tra đối chiếu CSDL & cache bộ nhớ trước khi cấp mã nạp.
  #        Nếu ngẫu nhiên vấp mã nạp đã tồn tại trong lịch sử, hệ thống tự động sinh lại mã mới (đảm bảo 100% không trùng đơn).
  # false = Bỏ qua kiểm tra đơn cũ, sinh mã random trực tiếp và trả về ngay.
  # ⚠ LƯU Ý KHI TẮT (false):
  #   - Tốc độ sinh mã sẽ NHANH HƠN NHIỀU (tối ưu hiệu năng tối đa do không cần truy vấn CSDL).
  #   - Kém an toàn hơn (có nguy cơ trùng đơn nếu số đơn ngâm quá lớn). Tuy nhiên với cấu hình mặc định
  #     (code-length: 12, code-mode: 0), không gian mã là 1.000 tỷ (10^12) khả năng ngẫu nhiên — tỉ lệ trùng
  #     khi có sẵn 100.000 đơn trong hệ thống chỉ khoảng 1 / 10.000.000 (0.00001%), cực kỳ nhỏ.
  #   - Mốc khuyến cáo: Dưới 50.000 đơn trong CSDL bạn có thể an tâm bật cả 2; Nếu trên 50.000 đơn
  #     mà đã bật include-date-prefix, nên đặt check-duplicate-orders: false để tránh gây giật lag server.
  check-duplicate-orders: true
  # Độ dài phần mã RANDOM phía sau (từ 1 đến 70). Khuyến nghị 12 để tránh trùng đơn.
  code-length: 12
  # Kiểu ký tự ngẫu nhiên: 0 = chỉ số (MẶC ĐỊNH - an toàn nhất cho SePay webhook) | 1 = chỉ chữ | -1 = cả số và chữ.
  code-mode: 0

# ── Lưu trữ đơn nạp cũ (bank-orders.yml / card-orders.yml) ─────────────────────
# v5.0.0: số ngày giữ lại đơn ĐÃ XỬ LÝ XONG (hết hạn/đã duyệt) trước khi tự xoá khỏi
# bộ nhớ + file lưu trữ. Đơn ĐANG CHỜ xử lý KHÔNG BAO GIỜ bị xoá dù giá trị là gì.
#   -1 = giữ VĨNH VIỄN, không bao giờ tự xoá (MẶC ĐỊNH — an toàn nhất cho việc tra soát).
#    0 = xoá NGAY (trong vòng tối đa 1 giờ — chu kỳ dọn dẹp định kỳ), không lưu lâu dài.
#   >0 = xoá sau đúng số ngày đó (vd 7 = giữ 7 ngày rồi xoá).
# Có 2 mục riêng — bank và card đặt số ngày khác nhau cũng được, không bắt buộc giống nhau.
order-retention:
  bank-days: -1
  card-days: -1

# Hiện 6 dòng thông tin (ngân hàng/STK/tên/tiền/nội dung CK/hết hạn) dưới ảnh QR hay
# chỉ hiện QR thuần (không chữ). Mặc định false = chỉ QR (full 128x128, nét hơn).
qr-show-info-overlay: false

# ── SePay API (v5.0.0 Phase B) ─────────────────────────────────────────────────
# Cách nạp bank MỚI, đơn giản hơn nhiều so với /sepaysetup cũ (chỉ cần dán 1 API
# Token — không cần webhook, không cần bot.py/ngrok, không cần biết merchant-id/
# secret-key). Plugin tự POLL trực tiếp API của SePay (my.sepay.vn) theo chu kỳ.
# Cấu hình qua lệnh trong-game: /sepaysetup (đã viết lại hoàn toàn ở v5.0.0).
# Admin KHÔNG cần tự sửa tay các dòng dưới — wizard /sepaysetup tự điền sau khi
# admin dán API token (tên ngân hàng/số TK/tên TK được lấy thẳng từ SePay).
sepay-api:
  enabled: false
  # true = dùng môi trường test my.dev.sepay.vn (không đụng tới giao dịch ngân hàng
  # thật — để bạn thử nghiệm/test plugin trước). false = dùng my.sepay.vn (thật).
  sandbox: false
  api-token: ''
  bank-account-number: ''
  bank-short-name: ''
  bank-full-name: ''
  bank-bin: ''
  account-holder-name: ''
  # Con trỏ phân trang khi poll giao dịch mới — KHÔNG tự sửa tay.
  last-transaction-id: 0
  # Số giây giữa mỗi lần poll giao dịch mới (mặc định 10s — đủ nhanh cho VietQR).
  poll-interval-seconds: 10

# ── SePay (Legacy Config) ──────────────────────────────────────────────────────
sepay:
  secret-key: ''
  merchant-id: ''
  bank-account: ''
  bank-name: ''
  account-name: ''
  configured: false

# ── Card API (Legacy Config) ───────────────────────────────────────────────────
card-api:
