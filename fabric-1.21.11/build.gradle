// v5.5.5 Part 61: SỬA LẠI Part 60 — cách cũ (khai 'dev.architectury.loom' version '1.13.469'
// riêng cho module này) THẤT BẠI khi build thật (lỗi tương tự fabric-1.21.10, cùng nguyên nhân:
// giới hạn cố hữu Gradle — 1 plugin ID chỉ tồn tại 1 version cho toàn build). Xem comment đầy đủ
// trong fabric-1.21.10/build.gradle (Part 61) để đọc toàn bộ lý do và nguồn xác nhận. Tóm tắt:
// đổi sang 'net.fabricmc.fabric-loom-remap' (Fabric Loom GỐC, plugin ID KHÁC hẳn nên không đụng
// độ classpath với 'dev.architectury.loom' ở root) — xác nhận chính thức MC 1.21.11 dùng đúng
// plugin ID này (docs.fabricmc.net). Module này cũng KHÔNG phụ thuộc kiến trúc Architectury nên
// đổi an toàn tuyệt đối.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java'
}

// v5.5.5 Part 62: module này giờ là COMPOSITE BUILD riêng (xem settings.gradle cùng thư mục +
// root settings.gradle 'includeBuild') — KHÔNG còn nằm trong allprojects{}/subprojects{} của
// root build.gradle nữa, nên PHẢI tự khai lại version/group/repositories/toolchain y hệt logic
// root (trước đây thừa hưởng tự động qua allprojects{} — xem LOG.md Part 62 để biết đầy đủ).
version = '5.5.5'
group = 'com.naptien'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

base {
    archivesName = "PayBot-Mod-Fabric-1.21.11"
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = true
    }
    compileClasspath.extendsFrom shadowBundle
    runtimeClasspath.extendsFrom shadowBundle
}

dependencies {
    // v5.5.5 Part 57: root build.gradle không còn tự làm hộ phần minecraft/mappings cho module
    // này nữa (bị loại trừ khỏi vòng lặp subprojects{} ở root) — tự khai lại y hệt logic root
    // vẫn dùng cho module khác.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Direct shaded libraries for Fabric & Quilt
    shadowBundle 'org.xerial:sqlite-jdbc:3.45.3.0'
    shadowBundle 'com.mysql:mysql-connector-j:8.4.0'
    shadowBundle 'com.zaxxer:HikariCP:5.1.0'
    shadowBundle 'org.yaml:snakeyaml:2.2'
    shadowBundle 'com.google.zxing:core:3.5.3'
    shadowBundle 'com.google.zxing:javase:3.5.3'
    shadowBundle 'org.nanohttpd:nanohttpd:2.3.1'
}

processResources {
    inputs.property "version", project.version

    filesMatching(["fabric.mod.json", "quilt.mod.json"]) {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"
    // v5.5.5 Part 44: loại trừ slf4j đóng gói theo HikariCP (xem giải thích ở fabric-legacy)
    exclude "org/slf4j/**"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}
