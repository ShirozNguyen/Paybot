# Tối ưu hóa hiệu năng Gradle tối đa (i5-12400F 12 threads, 32GB RAM)
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC -XX:+ParallelRefProcEnabled --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.base/java.awt=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.workers.max=8
org.gradle.caching=true
org.gradle.vfs.watch=true

