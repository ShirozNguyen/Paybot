pluginManagement {
    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        // v5.5.5 Part 49: thêm cho module 26.x dùng ModDevGradle (net.neoforged.moddev) —
        // xác nhận qua chính settings.gradle gốc của NeoForge (github.com/neoforged/NeoForge)
        // dùng đúng URL này. Plugin có trên Gradle Plugin Portal (gradlePluginPortal() bên dưới
        // đã đủ resolve) nhưng thêm trực tiếp để an toàn/nhất quán với template chính thức.
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

// v5.5.5 Part 49: foojay-resolver-convention — tự động tải/cấp JDK 25 nếu máy Shiroz chưa có
// sẵn (module 26.x bắt buộc Java 25). Chỉ ảnh hưởng module nào thật sự cần toolchain 25;
// module cũ (Java 17/21) không bị đụng vì Gradle chỉ dùng plugin này khi có toolchain
// request không khớp JDK đang chạy.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'PayBot'

