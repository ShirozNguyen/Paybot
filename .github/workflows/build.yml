name: Build PayBot

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PayBot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          validate-wrappers: false

      - name: Check Java
        run: java -version

      - name: Check Gradle
        run: gradle --version

      - name: Build project
        run: gradle build --parallel --build-cache --continue --stacktrace

      - name: Ensure Gradle Wrapper in all submodules
        shell: bash
        run: |
          for d in Fabric_Loader/* NeoForge_Loader/* Forge_Loader/*; do
            if [ -f "$d/gradlew" ]; then
              mkdir -p "$d/gradle/wrapper"
              if [ ! -s "$d/gradle/wrapper/gradle-wrapper.jar" ]; then
                cp gradle/wrapper/gradle-wrapper.jar "$d/gradle/wrapper/gradle-wrapper.jar"
                echo "Copied wrapper to $d"
              fi
            fi
          done

      # v5.5.5 Part 63 (sửa lại Part 62): 6 module dưới đây là 6 project Gradle HOÀN TOÀN ĐỘC
      # LẬP (không include(), không includeBuild() trong settings.gradle root) — mỗi cái có
      # gradlew + gradle-wrapper.properties riêng (9.2/9.4, khác bản 8.8 của root). 'gradle
      # build' ở root (bước "Build project" phía trên) HOÀN TOÀN KHÔNG đụng tới 6 module này
      # (root không hề biết chúng tồn tại) — phải gọi ./gradlew build TỪ BÊN TRONG từng thư mục
      # để dùng đúng engine Gradle riêng của nó. foojay-resolver-convention (đã khai trong
      # settings.gradle của 4 module 26.x) sẽ tự tải JDK 25 nếu runner GitHub Actions chưa có sẵn.
      # v5.5.5 Part 99: Bắt mã lỗi trung thực cho từng submodule độc lập, dừng build nếu có module lỗi.
      - name: Build independent modules (fabric-1.21.10, fabric-1.21.11)
        shell: bash
        run: |
          pids=()
          for mod in Fabric_Loader/fabric-1.21.10 Fabric_Loader/fabric-1.21.11; do
            echo "=== Building $mod (Gradle 9.5, project độc lập) ==="
            chmod +x "$mod/gradlew"
            (cd "$mod" && ./gradlew build --build-cache --stacktrace) &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

      - name: Build independent modules (fabric-26.x, neoforge-26.x)
        shell: bash
        run: |
          pids=()
          for mod in Fabric_Loader/fabric-26.1 Fabric_Loader/fabric-26.2 NeoForge_Loader/neoforge-26.1 NeoForge_Loader/neoforge-26.2; do
            echo "=== Building $mod (Gradle 9.4, project độc lập) ==="
            chmod +x "$mod/gradlew"
            (cd "$mod" && ./gradlew build --build-cache --stacktrace) &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

      # v5.5.5 Part 65: forge-26.1/26.2 tách khỏi Part 62 sau khi lỗi build thật xác nhận
      # "ForgeGradle 7 requires Gradle 9.3.0 or later. You are currently using Gradle 8.8."
      # foojay-resolver-convention (đã khai trong settings.gradle) tự tải JDK 25 nếu cần.
      - name: Build independent modules (forge-26.x)
        shell: bash
        run: |
          pids=()
          for mod in Forge_Loader/forge-26.1 Forge_Loader/forge-26.2; do
            echo "=== Building $mod (Gradle 9.3, project độc lập) ==="
            chmod +x "$mod/gradlew"
            (cd "$mod" && ./gradlew build --build-cache --stacktrace) &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

      # v5.5.5 Part 66: neoforge-1.21.10/11 tách sau khi lỗi build thật xác nhận "Unfixable
      # conflicts" khi remap qua dev.architectury.loom 1.7.435 (quá cũ cho NeoForge 1.21.10+).
      - name: Build independent modules (neoforge-1.21.10, neoforge-1.21.11)
        shell: bash
        run: |
          pids=()
          for mod in NeoForge_Loader/neoforge-1.21.10 NeoForge_Loader/neoforge-1.21.11; do
            echo "=== Building $mod (Gradle 9.2, project độc lập) ==="
            chmod +x "$mod/gradlew"
            (cd "$mod" && ./gradlew build --build-cache --stacktrace) &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

      # v5.5.5 Part 64: 16 module dưới đây (fabric-1.21.2 đến fabric-1.21.9, neoforge-1.21.2 đến
      # neoforge-1.21.9) là project Gradle HOÀN TOÀN ĐỘC LẬP.
      # v5.5.5 Part 99: Pool worker song song max 3 jobs kiểm tra exit code trung thực.
      - name: Build independent modules (fabric/neoforge 1.21.2-1.21.9)
        shell: bash
        run: |
          mods=(
            Fabric_Loader/fabric-1.21.2 Fabric_Loader/fabric-1.21.3 Fabric_Loader/fabric-1.21.4 Fabric_Loader/fabric-1.21.5
            Fabric_Loader/fabric-1.21.6 Fabric_Loader/fabric-1.21.7 Fabric_Loader/fabric-1.21.8 Fabric_Loader/fabric-1.21.9
            NeoForge_Loader/neoforge-1.21.2 NeoForge_Loader/neoforge-1.21.3 NeoForge_Loader/neoforge-1.21.4 NeoForge_Loader/neoforge-1.21.5
            NeoForge_Loader/neoforge-1.21.6 NeoForge_Loader/neoforge-1.21.7 NeoForge_Loader/neoforge-1.21.8 NeoForge_Loader/neoforge-1.21.9
          )
          for mod in "${mods[@]}"; do
            chmod +x "$mod/gradlew"
          done

          max_jobs=3
          current_jobs=0
          failed=0
          for mod in "${mods[@]}"; do
            (
              echo "=== Building $mod (Loom riêng) ==="
              (cd "$mod" && ./gradlew build --build-cache --stacktrace)
            ) &
            current_jobs=$((current_jobs + 1))
            if [ "$current_jobs" -ge "$max_jobs" ]; then
              wait -n || failed=1
              current_jobs=$((current_jobs - 1))
            fi
          done
          while [ "$current_jobs" -gt 0 ]; do
            wait -n || failed=1
            current_jobs=$((current_jobs - 1))
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

      - name: Collect JAR files
        shell: bash
        run: |
          mkdir -p artifacts

          find . -type f -path '*/build/libs/*.jar' \
            -exec cp {} artifacts/ \;

      # v5.5.5 Part 62: gom jar (kể cả 6 module độc lập ở trên) vào thư mục "Done" theo yêu cầu
      # Shiroz — thay cho Gradle task copyToDone (không còn bao quát được 6 module này vì chúng
      # không phải subprojects, xem comment trong root build.gradle). Phân loại theo tên thư mục
      # module, giống logic copyToDone cũ (loại trừ -dev/-shadow/-sources.jar).
      - name: Organize jars into Done folder
        shell: bash
        run: |
          mkdir -p Done/Fabric_Quilt Done/Forge Done/NeoForge Done/Plugins

          find . -type f -path '*/build/libs/*.jar' | while read -r f; do
            fname=$(basename "$f")
            case "$fname" in
              *-dev.jar|*-shadow.jar|*-sources.jar) continue ;;
            esac

            case "$f" in
              */Fabric_Loader/*) cp "$f" Done/Fabric_Quilt/ ;;
              */Forge_Loader/*) cp "$f" Done/Forge/ ;;
              */NeoForge_Loader/*) cp "$f" Done/NeoForge/ ;;
              */plugin/*) cp "$f" Done/Plugins/ ;;
            esac
          done

      - name: Upload Done folder
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-Done
          path: Done/
          if-no-files-found: error

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-build
          path: artifacts/
          if-no-files-found: error