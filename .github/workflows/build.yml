name: Build PayBot

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PayBot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          validate-wrappers: false

      - name: Check Java
        run: java -version

      - name: Check Gradle
        run: gradle --version

      - name: Build project
        run: gradle build --parallel --build-cache --continue --stacktrace

      - name: Audit Target Manifest
        shell: bash
        run: |
          python3 tools/target_auditor.py

      # v5.5.5 Part 115: Thu hoạch JAR của root project (loại trừ wrapper dummy < 1KB)
      - name: Harvest Root Modules JARs
        if: always()
        shell: bash
        run: |
          mkdir -p Done/Fabric_Quilt Done/Forge Done/NeoForge Done/Plugins
          mkdir -p artifacts
          mkdir -p build-diagnostics

          echo "=== Harvesting JARs from root project build ==="
          find . -type f -path '*/build/libs/*.jar' | while read -r f; do
            fname=$(basename "$f")
            case "$fname" in
              *-dev.jar|*-shadow.jar|*-sources.jar) continue ;;
            esac
            # Bỏ qua dummy wrapper jar rỗng (<1KB)
            fsize=$(wc -c < "$f")
            if [ "$fsize" -lt 1024 ]; then
              continue
            fi

            cp "$f" artifacts/ 2>/dev/null || true
            case "$f" in
              */Fabric_Loader/*) cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true ;;
              */Forge_Loader/*) cp "$f" Done/Forge/ 2>/dev/null || true ;;
              */NeoForge_Loader/*) cp "$f" Done/NeoForge/ 2>/dev/null || true ;;
              */plugin/*) cp "$f" Done/Plugins/ 2>/dev/null || true ;;
            esac
          done

      - name: Ensure Gradle Wrapper in all submodules
        if: always()
        shell: bash
        run: |
          for d in Fabric_Loader/* NeoForge_Loader/* Forge_Loader/*; do
            if [ -f "$d/gradlew" ]; then
              mkdir -p "$d/gradle/wrapper"
              if [ ! -s "$d/gradle/wrapper/gradle-wrapper.jar" ]; then
                cp gradle/wrapper/gradle-wrapper.jar "$d/gradle/wrapper/gradle-wrapper.jar"
                echo "Copied wrapper to $d"
              fi
            fi
          done

      # v5.5.5 Part 115: Build toàn bộ independent modules theo đúng Single Source of Truth từ build-targets.json
      - name: Build Independent Modules via Manifest Runner
        if: always()
        shell: bash
        run: |
          python3 tools/ci_builder.py

      # v5.5.5 Part 115: Kiểm toán toàn vẹn JAR, metadata và entrypoint theo chuẩn Master Spec
      - name: Validate Built JARs and Metadata
        if: always()
        shell: bash
        run: |
          python3 tools/jar_validator.py

      - name: Upload Done folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-Done
          path: Done/
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Build Diagnostics & Verification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-Diagnostics
          path: |
            build-diagnostics/
            jar-report.json
            SHA256SUMS
            feature-matrix.csv
            build-targets.json
          retention-days: 1
          if-no-files-found: ignore

      # v5.5.5 Part 115: Báo cáo trung thực theo đúng Mục 77 & 78 của Master Spec
      - name: Check Overall Truthful Build Status
        if: always()
        shell: bash
        run: |
          echo "========================================================"
          echo "=== PAYBOT TRUTHFUL BUILD & VERIFICATION SUMMARY ==="
          echo "========================================================"
          if [ -f build-diagnostics/failed_modules.txt ] && [ -s build-diagnostics/failed_modules.txt ]; then
            echo "❌ THE FOLLOWING MODULES FAILED TO BUILD:"
            cat build-diagnostics/failed_modules.txt
            echo "========================================================"
            echo "Detailed logs and diagnostic reports saved in artifacts."
            exit 1
          else
            echo "✅ All active targets in build-targets.json built & verified successfully!"
            echo "========================================================"
          fi