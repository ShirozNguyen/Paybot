name: Build PayBot

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PayBot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          validate-wrappers: false

      - name: Check Java
        run: java -version

      - name: Check Gradle
        run: gradle --version

      - name: Build project
        run: gradle build --parallel --build-cache --continue --stacktrace

      # v5.5.5 Part 100: Thu hoạch ngay lập tức 75+ file JAR của đại module chính và plugin
      - name: Harvest Root Modules JARs
        shell: bash
        run: |
          mkdir -p Done/Fabric_Quilt Done/Forge Done/NeoForge Done/Plugins
          mkdir -p artifacts
          mkdir -p build-diagnostics

          echo "=== Harvesting JARs from root project build ==="
          find . -type f -path '*/build/libs/*.jar' | while read -r f; do
            fname=$(basename "$f")
            case "$fname" in
              *-dev.jar|*-shadow.jar|*-sources.jar) continue ;;
            esac

            cp "$f" artifacts/ 2>/dev/null || true
            case "$f" in
              */Fabric_Loader/*) cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true ;;
              */Forge_Loader/*) cp "$f" Done/Forge/ 2>/dev/null || true ;;
              */NeoForge_Loader/*) cp "$f" Done/NeoForge/ 2>/dev/null || true ;;
              */plugin/*) cp "$f" Done/Plugins/ 2>/dev/null || true ;;
            esac
          done

      - name: Ensure Gradle Wrapper in all submodules
        shell: bash
        run: |
          for d in Fabric_Loader/* NeoForge_Loader/* Forge_Loader/*; do
            if [ -f "$d/gradlew" ]; then
              mkdir -p "$d/gradle/wrapper"
              if [ ! -s "$d/gradle/wrapper/gradle-wrapper.jar" ]; then
                cp gradle/wrapper/gradle-wrapper.jar "$d/gradle/wrapper/gradle-wrapper.jar"
                echo "Copied wrapper to $d"
              fi
            fi
          done

      # v5.5.5 Part 100: Cơ chế chẩn đoán toàn diện không tắc nghẽn (Batch Diagnostics Collector)
      # Giúp kiểm tra toàn bộ các submodule trong 1 lần chạy duy nhất, gom hết JAR thành công và
      # lưu lại toàn bộ log lỗi của các module chưa hoàn thiện mà không bị ngắt ngang.
      - name: Build independent modules (fabric-1.21.10, fabric-1.21.11)
        shell: bash
        run: |
          mkdir -p build-diagnostics
          for mod in Fabric_Loader/fabric-1.21.10 Fabric_Loader/fabric-1.21.11; do
            echo "=== Building $mod (Gradle 9.5, project độc lập) ==="
            chmod +x "$mod/gradlew"
            mod_name=$(basename "$mod")
            if (cd "$mod" && ./gradlew build --build-cache --stacktrace) > "build-diagnostics/${mod_name}.log" 2>&1; then
              echo ">>> [SUCCESS] $mod built successfully"
              find "$mod/build/libs" -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-shadow.jar" ! -name "*-sources.jar" | while read -r f; do
                cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true
                cp "$f" artifacts/ 2>/dev/null || true
              done
            else
              echo ">>> [FAILED] $mod failed to build"
              echo "$mod" >> build-diagnostics/failed_modules.txt
              echo "--- Last 25 lines of log for $mod ---"
              tail -n 25 "build-diagnostics/${mod_name}.log"
              echo "------------------------------------"
            fi
          done

      - name: Build independent modules (fabric-26.x, neoforge-26.x)
        shell: bash
        run: |
          mkdir -p build-diagnostics
          for mod in Fabric_Loader/fabric-26.1 Fabric_Loader/fabric-26.2 NeoForge_Loader/neoforge-26.1 NeoForge_Loader/neoforge-26.2; do
            echo "=== Building $mod (Gradle 9.4, project độc lập) ==="
            chmod +x "$mod/gradlew"
            mod_name=$(basename "$mod")
            if (cd "$mod" && ./gradlew build --build-cache --stacktrace) > "build-diagnostics/${mod_name}.log" 2>&1; then
              echo ">>> [SUCCESS] $mod built successfully"
              find "$mod/build/libs" -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-shadow.jar" ! -name "*-sources.jar" | while read -r f; do
                case "$mod" in
                  */Fabric_Loader/*) cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true ;;
                  */NeoForge_Loader/*) cp "$f" Done/NeoForge/ 2>/dev/null || true ;;
                esac
                cp "$f" artifacts/ 2>/dev/null || true
              done
            else
              echo ">>> [FAILED] $mod failed to build"
              echo "$mod" >> build-diagnostics/failed_modules.txt
              echo "--- Last 25 lines of log for $mod ---"
              tail -n 25 "build-diagnostics/${mod_name}.log"
              echo "------------------------------------"
            fi
          done

      - name: Build independent modules (forge-26.x)
        shell: bash
        run: |
          mkdir -p build-diagnostics
          for mod in Forge_Loader/forge-26.1 Forge_Loader/forge-26.2; do
            echo "=== Building $mod (Gradle 9.3, project độc lập) ==="
            chmod +x "$mod/gradlew"
            mod_name=$(basename "$mod")
            if (cd "$mod" && ./gradlew build --build-cache --stacktrace) > "build-diagnostics/${mod_name}.log" 2>&1; then
              echo ">>> [SUCCESS] $mod built successfully"
              find "$mod/build/libs" -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-shadow.jar" ! -name "*-sources.jar" | while read -r f; do
                cp "$f" Done/Forge/ 2>/dev/null || true
                cp "$f" artifacts/ 2>/dev/null || true
              done
            else
              echo ">>> [FAILED] $mod failed to build"
              echo "$mod" >> build-diagnostics/failed_modules.txt
              echo "--- Last 25 lines of log for $mod ---"
              tail -n 25 "build-diagnostics/${mod_name}.log"
              echo "------------------------------------"
            fi
          done

      - name: Build independent modules (neoforge-1.21.10, neoforge-1.21.11)
        shell: bash
        run: |
          mkdir -p build-diagnostics
          for mod in NeoForge_Loader/neoforge-1.21.10 NeoForge_Loader/neoforge-1.21.11; do
            echo "=== Building $mod (Gradle 9.2, project độc lập) ==="
            chmod +x "$mod/gradlew"
            mod_name=$(basename "$mod")
            if (cd "$mod" && ./gradlew build --build-cache --stacktrace) > "build-diagnostics/${mod_name}.log" 2>&1; then
              echo ">>> [SUCCESS] $mod built successfully"
              find "$mod/build/libs" -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-shadow.jar" ! -name "*-sources.jar" | while read -r f; do
                cp "$f" Done/NeoForge/ 2>/dev/null || true
                cp "$f" artifacts/ 2>/dev/null || true
              done
            else
              echo ">>> [FAILED] $mod failed to build"
              echo "$mod" >> build-diagnostics/failed_modules.txt
              echo "--- Last 25 lines of log for $mod ---"
              tail -n 25 "build-diagnostics/${mod_name}.log"
              echo "------------------------------------"
            fi
          done

      - name: Build independent modules (fabric/neoforge 1.21.2-1.21.9)
        shell: bash
        run: |
          mkdir -p build-diagnostics
          mods=(
            Fabric_Loader/fabric-1.21.2 Fabric_Loader/fabric-1.21.3 Fabric_Loader/fabric-1.21.4 Fabric_Loader/fabric-1.21.5
            Fabric_Loader/fabric-1.21.6 Fabric_Loader/fabric-1.21.7 Fabric_Loader/fabric-1.21.8 Fabric_Loader/fabric-1.21.9
            NeoForge_Loader/neoforge-1.21.2 NeoForge_Loader/neoforge-1.21.3 NeoForge_Loader/neoforge-1.21.4 NeoForge_Loader/neoforge-1.21.5
            NeoForge_Loader/neoforge-1.21.6 NeoForge_Loader/neoforge-1.21.7 NeoForge_Loader/neoforge-1.21.8 NeoForge_Loader/neoforge-1.21.9
          )
          for mod in "${mods[@]}"; do
            chmod +x "$mod/gradlew"
            mod_name=$(basename "$mod")
            echo "=== Building $mod (Loom riêng) ==="
            if (cd "$mod" && ./gradlew build --build-cache --stacktrace) > "build-diagnostics/${mod_name}.log" 2>&1; then
              echo ">>> [SUCCESS] $mod built successfully"
              find "$mod/build/libs" -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-shadow.jar" ! -name "*-sources.jar" | while read -r f; do
                case "$mod" in
                  */Fabric_Loader/*) cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true ;;
                  */NeoForge_Loader/*) cp "$f" Done/NeoForge/ 2>/dev/null || true ;;
                esac
                cp "$f" artifacts/ 2>/dev/null || true
              done
            else
              echo ">>> [FAILED] $mod failed to build"
              echo "$mod" >> build-diagnostics/failed_modules.txt
              echo "--- Last 25 lines of log for $mod ---"
              tail -n 25 "build-diagnostics/${mod_name}.log"
              echo "------------------------------------"
            fi
          done

      # v5.5.5 Part 100: Vét lần cuối tất cả các JAR sinh ra trong toàn bộ workspace
      - name: Final Collect of All JAR Files
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts Done/Fabric_Quilt Done/Forge Done/NeoForge Done/Plugins
          find . -type f -path '*/build/libs/*.jar' | while read -r f; do
            fname=$(basename "$f")
            case "$fname" in
              *-dev.jar|*-shadow.jar|*-sources.jar) continue ;;
            esac
            cp "$f" artifacts/ 2>/dev/null || true
            case "$f" in
              */Fabric_Loader/*) cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true ;;
              */Forge_Loader/*) cp "$f" Done/Forge/ 2>/dev/null || true ;;
              */NeoForge_Loader/*) cp "$f" Done/NeoForge/ 2>/dev/null || true ;;
              */plugin/*) cp "$f" Done/Plugins/ 2>/dev/null || true ;;
            esac
          done

      - name: Upload Done folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-Done
          path: Done/
          if-no-files-found: warn

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-build
          path: artifacts/
          if-no-files-found: warn

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-Diagnostics
          path: build-diagnostics/
          if-no-files-found: ignore

      - name: Check Overall Build Status
        shell: bash
        run: |
          echo "========================================================"
          echo "=== PAYBOT BUILD DIAGNOSTICS & STATUS SUMMARY ==="
          echo "========================================================"
          if [ -f build-diagnostics/failed_modules.txt ] && [ -s build-diagnostics/failed_modules.txt ]; then
            echo "❌ THE FOLLOWING SUBMODULES FAILED TO BUILD:"
            cat build-diagnostics/failed_modules.txt
            echo "========================================================"
            echo "Detailed error logs are saved in 'PayBot-Diagnostics' artifact."
            echo "All successfully built JARs have been packaged into 'PayBot-Done'."
            exit 1
          else
            echo "========================================================"
            echo "✅ CONGRATULATIONS! ALL 102 MODULES BUILT SUCCESSFULLY (100%)!"
            echo "========================================================"
          fi