name: Build PayBot

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-elastic-cluster:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Node 1: [Fast: 26.x Fabric] -> [Main: Plugin & Fabric 1.16.5-1.18.2]"
            node_id: "node-1-fabric-116-118"
            indep_mods: "Fabric_Loader/fabric-26.1 Fabric_Loader/fabric-26.2"
            root_batch_1: ":plugin:build :Fabric_Loader:fabric-1.16.5:build :Fabric_Loader:fabric-1.17.1:build"
            root_batch_2: ":Fabric_Loader:fabric-1.18:build :Fabric_Loader:fabric-1.18.1:build :Fabric_Loader:fabric-1.18.2:build"

          - name: "Node 2: [Fast: Fabric 1.21.10-11] -> [Main: Fabric 1.19-1.19.4]"
            node_id: "node-2-fabric-119"
            indep_mods: "Fabric_Loader/fabric-1.21.10 Fabric_Loader/fabric-1.21.11"
            root_batch_1: ":Fabric_Loader:fabric-1.19:build :Fabric_Loader:fabric-1.19.1:build :Fabric_Loader:fabric-1.19.2:build"
            root_batch_2: ":Fabric_Loader:fabric-1.19.3:build :Fabric_Loader:fabric-1.19.4:build"

          - name: "Node 3: [Fast: Fabric 1.21.2-5] -> [Main: Fabric 1.20-1.20.4]"
            node_id: "node-3-fabric-120"
            indep_mods: "Fabric_Loader/fabric-1.21.2 Fabric_Loader/fabric-1.21.3 Fabric_Loader/fabric-1.21.4 Fabric_Loader/fabric-1.21.5"
            root_batch_1: ":Fabric_Loader:fabric-1.20:build :Fabric_Loader:fabric-1.20.1:build :Fabric_Loader:fabric-1.20.2:build"
            root_batch_2: ":Fabric_Loader:fabric-1.20.3:build :Fabric_Loader:fabric-1.20.4:build"

          - name: "Node 4: [Fast: Fabric 1.21.6-9] -> [Main: Fabric 1.20.5-1.21.1]"
            node_id: "node-4-fabric-1205-1211"
            indep_mods: "Fabric_Loader/fabric-1.21.6 Fabric_Loader/fabric-1.21.7 Fabric_Loader/fabric-1.21.8 Fabric_Loader/fabric-1.21.9"
            root_batch_1: ":Fabric_Loader:fabric-1.20.5:build :Fabric_Loader:fabric-1.20.6:build"
            root_batch_2: ":Fabric_Loader:fabric-1.21:build :Fabric_Loader:fabric-1.21.1:build"

          - name: "Node 5: [Fast: NeoForge 1.21.10-26.2] -> [Main: Forge 1.16.2-1.18.2]"
            node_id: "node-5-forge-116-118"
            indep_mods: "NeoForge_Loader/neoforge-1.21.10 NeoForge_Loader/neoforge-1.21.11 NeoForge_Loader/neoforge-26.1 NeoForge_Loader/neoforge-26.2"
            root_batch_1: ":Forge_Loader:forge-1.16.2:build :Forge_Loader:forge-1.16.3:build :Forge_Loader:forge-1.16.4:build :Forge_Loader:forge-1.16.5:build"
            root_batch_2: ":Forge_Loader:forge-1.17.1:build :Forge_Loader:forge-1.18:build :Forge_Loader:forge-1.18.1:build :Forge_Loader:forge-1.18.2:build"

          - name: "Node 6: [Fast: Forge 26.x] -> [Main: Forge 1.19-1.20.2]"
            node_id: "node-6-forge-119-120"
            indep_mods: "Forge_Loader/forge-26.1 Forge_Loader/forge-26.2"
            root_batch_1: ":Forge_Loader:forge-1.19:build :Forge_Loader:forge-1.19.1:build :Forge_Loader:forge-1.19.2:build :Forge_Loader:forge-1.19.3:build"
            root_batch_2: ":Forge_Loader:forge-1.19.4:build :Forge_Loader:forge-1.20:build :Forge_Loader:forge-1.20.1:build :Forge_Loader:forge-1.20.2:build"

          - name: "Node 7: [Fast: NeoForge 1.21.2-5] -> [Main: NeoForge 1.20.2-1.20.5]"
            node_id: "node-7-neoforge-1202-1205"
            indep_mods: "NeoForge_Loader/neoforge-1.21.2 NeoForge_Loader/neoforge-1.21.3 NeoForge_Loader/neoforge-1.21.4 NeoForge_Loader/neoforge-1.21.5"
            root_batch_1: ":NeoForge_Loader:neoforge-1.20.2:build :NeoForge_Loader:neoforge-1.20.3:build"
            root_batch_2: ":NeoForge_Loader:neoforge-1.20.4:build :NeoForge_Loader:neoforge-1.20.5:build"

          - name: "Node 8: [Fast: NeoForge 1.21.6-9] -> [Main: NeoForge 1.20.6-1.21.1]"
            node_id: "node-8-neoforge-1206-1211"
            indep_mods: "NeoForge_Loader/neoforge-1.21.6 NeoForge_Loader/neoforge-1.21.7 NeoForge_Loader/neoforge-1.21.8 NeoForge_Loader/neoforge-1.21.9"
            root_batch_1: ":NeoForge_Loader:neoforge-1.20.6:build :NeoForge_Loader:neoforge-1.21:build"
            root_batch_2: ":NeoForge_Loader:neoforge-1.21.1:build"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          validate-wrappers: false

      - name: Additive Cascade Build & Self-Healing Compensation Engine
        shell: bash
        run: |
          mkdir -p build-diagnostics Done/Fabric_Quilt Done/Forge Done/NeoForge Done/Plugins
          TOTAL_CORES=$(nproc || echo 4)
          MOD_ARRAY=(${{ matrix.indep_mods }})
          TOTAL_MODS=${#MOD_ARRAY[@]}

          # Biến đếm cấp số cộng: mỗi bộ module xong sẽ cộng dồn thêm +1536MB RAM và +1 Thread cho bộ tiếp theo!
          DONE_STEPS=0
          BASE_RAM=3072
          STEP_RAM=1536
          BASE_THREADS=2
          MAX_RAM=13312

          for d in "${MOD_ARRAY[@]}"; do
            if [ -f "$d/gradlew" ]; then
              mkdir -p "$d/gradle/wrapper"
              if [ ! -s "$d/gradle/wrapper/gradle-wrapper.jar" ]; then
                cp gradle/wrapper/gradle-wrapper.jar "$d/gradle/wrapper/gradle-wrapper.jar" 2>/dev/null || true
              fi
              chmod +x "$d/gradlew"
            fi
          done

          build_indep() {
            local mod="$1"
            local heap_mb="$2"
            local threads="$3"
            local mod_name=$(basename "$mod")
            local mc_ver="${mod_name#*-}"
            find ~/.gradle/caches/fabric-loom/"${mc_ver}" -name "*at-patched.jar" -delete 2>/dev/null || true
            echo "=== [ADDITIVE CASCADE] Building $mod (Allocated: ${heap_mb}MB RAM, ${threads} Threads | Completed steps: ${DONE_STEPS}) ==="
            if (cd "$mod" && GRADLE_OPTS="-Xmx${heap_mb}m -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:ActiveProcessorCount=${threads} -Dorg.gradle.daemon=false" ./gradlew build --parallel --max-workers=${threads} --build-cache --stacktrace) > "build-diagnostics/${mod_name}.log" 2>&1; then
              echo ">>> [SUCCESS] $mod built successfully"
              return 0
            else
              echo ">>> [QUEUED FOR COMPENSATION] $mod will be retried with full cumulative resources"
              echo "INDEP:$mod" >> "build-diagnostics/compensate_${{ matrix.node_id }}.txt"
              return 1
            fi
          }

          for m in "${MOD_ARRAY[@]}"; do
            add_ram=$(( BASE_RAM + DONE_STEPS * STEP_RAM ))
            if [ "$add_ram" -lt 6144 ]; then add_ram=6144; fi
            if [ "$add_ram" -gt "$MAX_RAM" ]; then add_ram=$MAX_RAM; fi
            t_alloc=$(( BASE_THREADS + DONE_STEPS ))
            if [ "$t_alloc" -gt "$TOTAL_CORES" ]; then t_alloc=$TOTAL_CORES; fi

            build_indep "$m" "$add_ram" "$t_alloc" || true
            DONE_STEPS=$(( DONE_STEPS + 1 ))
          done

          # Phase 2: Dồn cấp số cộng từ các module nhỏ vừa xong sang Main Batch 1 & Main Batch 2
          HEAP_MAIN_1=$(( BASE_RAM + DONE_STEPS * STEP_RAM ))
          if [ "$HEAP_MAIN_1" -lt 9216 ]; then HEAP_MAIN_1=9216; fi
          if [ "$HEAP_MAIN_1" -gt "$MAX_RAM" ]; then HEAP_MAIN_1=$MAX_RAM; fi
          THREADS_MAIN_1=$(( BASE_THREADS + DONE_STEPS ))
          if [ "$THREADS_MAIN_1" -gt "$TOTAL_CORES" ]; then THREADS_MAIN_1=$TOTAL_CORES; fi

          echo ">>> [ADDITIVE CASCADE -> MAIN 1] Completed=${DONE_STEPS} -> Pouring ${HEAP_MAIN_1}MB RAM & ${THREADS_MAIN_1} Threads into: ${{ matrix.root_batch_1 }}"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=\"-Xmx${HEAP_MAIN_1}m -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:ActiveProcessorCount=${THREADS_MAIN_1}\" -Dorg.gradle.daemon=true"
          if gradle ${{ matrix.root_batch_1 }} --parallel --max-workers=${THREADS_MAIN_1} --build-cache --continue --stacktrace > "build-diagnostics/${{ matrix.node_id }}-main1.log" 2>&1; then
            DONE_STEPS=$(( DONE_STEPS + 3 ))
          else
            for task in ${{ matrix.root_batch_1 }}; do
              echo "ROOT:$task" >> "build-diagnostics/compensate_${{ matrix.node_id }}.txt"
            done
          fi

          HEAP_MAIN_2=$(( BASE_RAM + DONE_STEPS * STEP_RAM ))
          if [ "$HEAP_MAIN_2" -lt 11264 ]; then HEAP_MAIN_2=11264; fi
          if [ "$HEAP_MAIN_2" -gt "$MAX_RAM" ]; then HEAP_MAIN_2=$MAX_RAM; fi

          echo ">>> [ADDITIVE CASCADE -> MAIN 2] Completed=${DONE_STEPS} -> Pouring ${HEAP_MAIN_2}MB RAM & ${TOTAL_CORES} Threads into: ${{ matrix.root_batch_2 }}"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=\"-Xmx${HEAP_MAIN_2}m -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:ActiveProcessorCount=${TOTAL_CORES}\" -Dorg.gradle.daemon=true"
          if gradle ${{ matrix.root_batch_2 }} --parallel --max-workers=${TOTAL_CORES} --build-cache --continue --stacktrace > "build-diagnostics/${{ matrix.node_id }}-main2.log" 2>&1; then
            DONE_STEPS=$(( DONE_STEPS + 3 ))
          else
            for task in ${{ matrix.root_batch_2 }}; do
              echo "ROOT:$task" >> "build-diagnostics/compensate_${{ matrix.node_id }}.txt"
            done
          fi

          # Phase 3: Cơ chế Tự Động Bù (Self-Healing Compensation) - Nếu còn bất kỳ module nào thiếu/lỗi,
          # dồn 100% tài nguyên tích lũy cực đại (13,312MB RAM + toàn bộ CPU Threads) để build bù từng cái cho tới khi xong!
          if [ -f "build-diagnostics/compensate_${{ matrix.node_id }}.txt" ]; then
            echo ">>> [SELF-HEALING COMPENSATION] Pouring 100% Cumulative Power (${MAX_RAM}MB RAM + ${TOTAL_CORES} Threads) into remaining targets..."
            gradle --stop || true
            while read -r item; do
              [ -z "$item" ] && continue
              kind="${item%%:*}"
              target="${item#*:}"
              if [ "$kind" = "INDEP" ]; then
                mod_name=$(basename "$target")
                mc_ver="${mod_name#*-}"
                echo ">>> [COMPENSATE INDEP] Cleaning stale Loom cache for ${mod_name} (${mc_ver}) and rebuilding with ${MAX_RAM}MB RAM..."
                rm -rf ~/.gradle/caches/fabric-loom/"${mc_ver}" "$target/.gradle" "$target/build" 2>/dev/null || true
                if ! (cd "$target" && GRADLE_OPTS="-Xmx${MAX_RAM}m -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC -XX:ActiveProcessorCount=${TOTAL_CORES} -Dorg.gradle.daemon=false" ./gradlew build --parallel --max-workers=${TOTAL_CORES} --stacktrace) > "build-diagnostics/${mod_name}.log" 2>&1; then
                  echo "$target" >> "build-diagnostics/failed_${{ matrix.node_id }}.txt"
                else
                  echo ">>> [COMPENSATE SUCCESS] $target recovered and built!"
                fi
              else
                echo ">>> [COMPENSATE ROOT] Rebuilding $target with ${MAX_RAM}MB RAM..."
                if ! gradle "$target" --parallel --max-workers=${TOTAL_CORES} --stacktrace >> "build-diagnostics/${{ matrix.node_id }}-compensate.log" 2>&1; then
                  echo "$target" >> "build-diagnostics/failed_${{ matrix.node_id }}.txt"
                else
                  echo ">>> [COMPENSATE SUCCESS] $target recovered and built!"
                fi
              fi
            done < "build-diagnostics/compensate_${{ matrix.node_id }}.txt"
          fi
          gradle --stop || true

      - name: Harvest Node JARs
        if: always()
        shell: bash
        run: |
          mkdir -p Done/Fabric_Quilt Done/Forge Done/NeoForge Done/Plugins
          find . -type f -path '*/build/libs/*.jar' | while read -r f; do
            fname=$(basename "$f")
            case "$fname" in
              *-dev.jar|*-shadow.jar|*-sources.jar) continue ;;
            esac
            fsize=$(wc -c < "$f")
            if [ "$fsize" -lt 1024 ]; then
              continue
            fi
            case "$f" in
              */Fabric_Loader/*) cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true ;;
              */Forge_Loader/*) cp "$f" Done/Forge/ 2>/dev/null || true ;;
              */NeoForge_Loader/*) cp "$f" Done/NeoForge/ 2>/dev/null || true ;;
              */plugin/*) cp "$f" Done/Plugins/ 2>/dev/null || true ;;
            esac
          done

      - name: Upload Node Done
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: done-${{ matrix.node_id }}
          path: Done/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Node Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.node_id }}
          path: build-diagnostics/
          retention-days: 1
          if-no-files-found: ignore

  collect-and-verify:
    name: Collect, Audit and Package Artifacts
    runs-on: ubuntu-latest
    needs: [build-elastic-cluster]
    if: always()

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create directories
        shell: bash
        run: |
          mkdir -p Done/Fabric_Quilt Done/Forge Done/NeoForge Done/Plugins
          mkdir -p build-diagnostics artifacts

      - name: Download All Done Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "done-*"
          merge-multiple: true
          path: Done/
        continue-on-error: true

      - name: Download All Diag Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "diag-*"
          merge-multiple: true
          path: build-diagnostics/
        continue-on-error: true

      - name: Check if Global Self-Healing Compensation is Needed
        id: check_missing
        shell: bash
        run: |
          cat build-diagnostics/failed_*.txt 2>/dev/null | sort -u > build-diagnostics/global_compensate_queue.txt || true
          rm -f build-diagnostics/failed_*.txt build-diagnostics/failed_modules.txt
          if [ -s build-diagnostics/global_compensate_queue.txt ]; then
            echo "needs_compensation=true" >> "$GITHUB_OUTPUT"
            echo ">>> Found missing modules requiring Global Compensation:"
            cat build-diagnostics/global_compensate_queue.txt
          else
            echo "needs_compensation=false" >> "$GITHUB_OUTPUT"
            echo ">>> All 8 Elastic Nodes completed 100% of targets with 0 missing modules!"
          fi

      - name: Setup JDK 8, 17, 21, 25 (For Global Self-Healing Compensation)
        if: steps.check_missing.outputs.needs_compensation == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
            21
            25
          cache: 'gradle'

      - name: Setup Gradle 8.9 (For Global Self-Healing Compensation)
        if: steps.check_missing.outputs.needs_compensation == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
          validate-wrappers: false

      - name: Global Self-Healing Compensation Engine (Build Any Missing Modules with 100% Cluster Power)
        if: steps.check_missing.outputs.needs_compensation == 'true'
        shell: bash
        run: |
          if [ -s build-diagnostics/global_compensate_queue.txt ]; then
            echo "========================================================"
            echo ">>> [GLOBAL SELF-HEALING COMPENSATION ENGINE ACTIVATED]"
            echo ">>> All 8 Nodes finished -> Pouring 100% Runner Power (13,312MB RAM + 4 Threads) to compensate missing modules:"
            cat build-diagnostics/global_compensate_queue.txt
            echo "========================================================"
            while read -r target; do
              [ -z "$target" ] && continue
              if [ -d "$target" ] && [ -f "$target/gradlew" ]; then
                chmod +x "$target/gradlew"
                mod_name=$(basename "$target")
                mc_ver="${mod_name#*-}"
                echo ">>> [GLOBAL COMPENSATE INDEP] Cleaning Loom cache for ${mod_name} (${mc_ver}) & Building with 13,312MB RAM + 4 Threads..."
                rm -rf ~/.gradle/caches/fabric-loom/"${mc_ver}" "$target/.gradle" "$target/build" 2>/dev/null || true
                if (cd "$target" && GRADLE_OPTS="-Xmx13312m -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:ActiveProcessorCount=4 -Dorg.gradle.daemon=false" ./gradlew build --parallel --max-workers=4 --stacktrace) > "build-diagnostics/${mod_name}.log" 2>&1; then
                  echo ">>> [GLOBAL COMPENSATE SUCCESS] $target built!"
                  find "$target/build/libs" -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-shadow.jar" ! -name "*-sources.jar" | while read -r f; do
                    case "$target" in
                      *Fabric_Loader*) cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true ;;
                      *Forge_Loader*) cp "$f" Done/Forge/ 2>/dev/null || true ;;
                      *NeoForge_Loader*) cp "$f" Done/NeoForge/ 2>/dev/null || true ;;
                      *plugin*) cp "$f" Done/Plugins/ 2>/dev/null || true ;;
                    esac
                  done
                else
                  echo ">>> [GLOBAL COMPENSATE FAILED] $target still failed!"
                  echo "$target" >> build-diagnostics/failed_modules.txt
                fi
              else
                echo ">>> [GLOBAL COMPENSATE ROOT] Building $target with 13,312MB RAM + 4 Threads..."
                export GRADLE_OPTS="-Dorg.gradle.jvmargs=\"-Xmx13312m -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:ActiveProcessorCount=4\" -Dorg.gradle.daemon=false"
                if gradle "$target" --parallel --max-workers=4 --stacktrace >> "build-diagnostics/global-root-compensate.log" 2>&1; then
                  echo ">>> [GLOBAL COMPENSATE SUCCESS] $target built!"
                  find . -type f -path '*/build/libs/*.jar' ! -name "*-dev.jar" ! -name "*-shadow.jar" ! -name "*-sources.jar" | while read -r f; do
                    case "$f" in
                      */Fabric_Loader/*) cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true ;;
                      */Forge_Loader/*) cp "$f" Done/Forge/ 2>/dev/null || true ;;
                      */NeoForge_Loader/*) cp "$f" Done/NeoForge/ 2>/dev/null || true ;;
                      */plugin/*) cp "$f" Done/Plugins/ 2>/dev/null || true ;;
                    esac
                  done
                else
                  echo ">>> [GLOBAL COMPENSATE FAILED] $target still failed!"
                  echo "$target" >> build-diagnostics/failed_modules.txt
                fi
              fi
            done < build-diagnostics/global_compensate_queue.txt
          else
            echo ">>> [GLOBAL SELF-HEALING COMPENSATION] 0 missing modules from the 8 Elastic Nodes!"
          fi

      - name: Synchronize artifacts folder
        shell: bash
        run: |
          find Done -type f -name "*.jar" -exec cp {} artifacts/ \; 2>/dev/null || true

      - name: Run JAR Validator
        shell: bash
        run: |
          if [ -f tools/jar_validator.py ]; then
            python tools/jar_validator.py || true
          fi

      - name: Upload Official Done folder
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-Done
          path: Done/
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Official Diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-Diagnostics
          path: build-diagnostics/
          retention-days: 1
          if-no-files-found: ignore

      - name: Check Overall Build Status
        shell: bash
        run: |
          echo "========================================================"
          echo "=== PAYBOT BUILD DIAGNOSTICS & STATUS SUMMARY ==="
          echo "========================================================"
          if [ -f build-diagnostics/failed_modules.txt ] && [ -s build-diagnostics/failed_modules.txt ]; then
            echo "❌ THE FOLLOWING MODULES FAILED TO BUILD AFTER ALL COMPENSATION PASSES:"
            cat build-diagnostics/failed_modules.txt
            echo "========================================================"
            echo "Detailed error logs are saved in 'PayBot-Diagnostics' artifact."
            echo "All successfully built JARs have been packaged into 'PayBot-Done'."
            exit 1
          else
            echo "========================================================"
            echo "✅ ALL ACTIVE TARGETS BUILT SUCCESSFULLY!"
            echo "========================================================"
          fi
