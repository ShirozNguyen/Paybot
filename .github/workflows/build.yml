name: Build PayBot

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PayBot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Java
        run: java -version

      - name: Check Gradle
        run: gradle --version

      - name: Build project
        run: gradle build --stacktrace

      - name: Collect JAR files
        shell: bash
        run: |
          mkdir -p artifacts

          find . -type f -path '*/build/libs/*.jar' \
            -exec cp {} artifacts/ \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-build
          path: artifacts/
          if-no-files-found: error