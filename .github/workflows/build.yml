name: Build PayBot

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-root:
    name: Build Root Modules (43 Targets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          validate-wrappers: false

      - name: Check Java
        run: java -version

      - name: Check Gradle
        run: gradle --version

      - name: Build project
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -Dorg.gradle.daemon=false"
        shell: bash
        run: |
          mkdir -p build-diagnostics
          if ! gradle build --parallel --build-cache --continue --stacktrace; then
            echo "root_project" >> build-diagnostics/failed_root.txt
          fi

      - name: Harvest Root Modules JARs
        if: always()
        shell: bash
        run: |
          mkdir -p Done/Fabric_Quilt Done/Forge Done/NeoForge Done/Plugins
          mkdir -p build-diagnostics

          echo "=== Harvesting JARs from root project build ==="
          find . -type f -path '*/build/libs/*.jar' | while read -r f; do
            fname=$(basename "$f")
            case "$fname" in
              *-dev.jar|*-shadow.jar|*-sources.jar) continue ;;
            esac
            fsize=$(wc -c < "$f")
            if [ "$fsize" -lt 1024 ]; then
              continue
            fi

            case "$f" in
              */Fabric_Loader/*) cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true ;;
              */Forge_Loader/*) cp "$f" Done/Forge/ 2>/dev/null || true ;;
              */NeoForge_Loader/*) cp "$f" Done/NeoForge/ 2>/dev/null || true ;;
              */plugin/*) cp "$f" Done/Plugins/ 2>/dev/null || true ;;
            esac
          done

      - name: Upload Root Done
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-done
          path: Done/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Root Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-diag
          path: build-diagnostics/
          retention-days: 1
          if-no-files-found: ignore

  build-independent:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Independent: 26.x (Fabric, Forge, NeoForge)"
            group: "indep-26x"
            mods: "Fabric_Loader/fabric-26.1 Fabric_Loader/fabric-26.2 NeoForge_Loader/neoforge-26.1 NeoForge_Loader/neoforge-26.2 Forge_Loader/forge-26.1 Forge_Loader/forge-26.2"
            jvm_ram: "-Xmx2048m"

          - name: "Independent: 1.21.10 & 1.21.11"
            group: "indep-121-modern"
            mods: "NeoForge_Loader/neoforge-1.21.10 NeoForge_Loader/neoforge-1.21.11 Fabric_Loader/fabric-1.21.10 Fabric_Loader/fabric-1.21.11"
            jvm_ram: "-Xmx2048m"

          - name: "Independent: Fabric 1.21.2 - 1.21.9"
            group: "indep-fabric-121"
            mods: "Fabric_Loader/fabric-1.21.2 Fabric_Loader/fabric-1.21.3 Fabric_Loader/fabric-1.21.4 Fabric_Loader/fabric-1.21.5 Fabric_Loader/fabric-1.21.6 Fabric_Loader/fabric-1.21.7 Fabric_Loader/fabric-1.21.8 Fabric_Loader/fabric-1.21.9"
            jvm_ram: "-Xmx1536m"

          - name: "Independent: NeoForge 1.21.2 - 1.21.9"
            group: "indep-neoforge-121"
            mods: "NeoForge_Loader/neoforge-1.21.2 NeoForge_Loader/neoforge-1.21.3 NeoForge_Loader/neoforge-1.21.4 NeoForge_Loader/neoforge-1.21.5 NeoForge_Loader/neoforge-1.21.6 NeoForge_Loader/neoforge-1.21.7 NeoForge_Loader/neoforge-1.21.8 NeoForge_Loader/neoforge-1.21.9"
            jvm_ram: "-Xmx1536m"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Gradle Wrapper in matrix submodules
        shell: bash
        run: |
          for d in ${{ matrix.mods }}; do
            if [ -f "$d/gradlew" ]; then
              mkdir -p "$d/gradle/wrapper"
              if [ ! -s "$d/gradle/wrapper/gradle-wrapper.jar" ]; then
                cp gradle/wrapper/gradle-wrapper.jar "$d/gradle/wrapper/gradle-wrapper.jar" 2>/dev/null || true
              fi
            fi
          done

      - name: Build independent modules
        shell: bash
        run: |
          export GRADLE_OPTS="${{ matrix.jvm_ram }} -XX:+UseG1GC -Dorg.gradle.daemon=false"
          mkdir -p build-diagnostics Done/Fabric_Quilt Done/Forge Done/NeoForge Done/Plugins
          for mod in ${{ matrix.mods }}; do
            chmod +x "$mod/gradlew"
            mod_name=$(basename "$mod")
            echo "=== Building $mod ==="
            if (cd "$mod" && ./gradlew build --build-cache --stacktrace) > "build-diagnostics/${mod_name}.log" 2>&1; then
              echo ">>> [SUCCESS] $mod built successfully"
              find "$mod/build/libs" -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-shadow.jar" ! -name "*-sources.jar" | while read -r f; do
                case "$mod" in
                  *Fabric_Loader*) cp "$f" Done/Fabric_Quilt/ 2>/dev/null || true ;;
                  *Forge_Loader*) cp "$f" Done/Forge/ 2>/dev/null || true ;;
                  *NeoForge_Loader*) cp "$f" Done/NeoForge/ 2>/dev/null || true ;;
                esac
              done
            else
              echo ">>> [FAILED] $mod failed to build"
              echo "$mod" >> build-diagnostics/failed_${{ matrix.group }}.txt
              echo "--- Last 25 lines of log for $mod ---"
              tail -n 25 "build-diagnostics/${mod_name}.log"
              echo "------------------------------------"
            fi
          done

      - name: Upload Group Done
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: done-${{ matrix.group }}
          path: Done/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Group Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.group }}
          path: build-diagnostics/
          retention-days: 1
          if-no-files-found: ignore

  collect-and-verify:
    name: Collect, Audit and Package Artifacts
    runs-on: ubuntu-latest
    needs: [build-root, build-independent]
    if: always()

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create directories
        shell: bash
        run: |
          mkdir -p Done/Fabric_Quilt Done/Forge Done/NeoForge Done/Plugins
          mkdir -p build-diagnostics artifacts

      - name: Download Root Done
        uses: actions/download-artifact@v4
        with:
          name: root-done
          path: Done/
        continue-on-error: true

      - name: Download Root Diag
        uses: actions/download-artifact@v4
        with:
          name: root-diag
          path: build-diagnostics/
        continue-on-error: true

      - name: Download Matrix Done Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "done-*"
          merge-multiple: true
          path: Done/
        continue-on-error: true

      - name: Download Matrix Diag Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "diag-*"
          merge-multiple: true
          path: build-diagnostics/
        continue-on-error: true

      - name: Synchronize artifacts folder
        shell: bash
        run: |
          find Done -type f -name "*.jar" -exec cp {} artifacts/ \; 2>/dev/null || true

      - name: Run JAR Validator
        shell: bash
        run: |
          if [ -f tools/jar_validator.py ]; then
            python tools/jar_validator.py || true
          fi

      - name: Upload Official Done folder
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-Done
          path: Done/
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Official Diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: PayBot-Diagnostics
          path: build-diagnostics/
          retention-days: 1
          if-no-files-found: ignore

      - name: Check Overall Build Status
        shell: bash
        run: |
          echo "========================================================"
          echo "=== PAYBOT BUILD DIAGNOSTICS & STATUS SUMMARY ==="
          echo "========================================================"
          cat build-diagnostics/failed_*.txt > build-diagnostics/failed_modules.txt 2>/dev/null || true
          if [ -f build-diagnostics/failed_modules.txt ] && [ -s build-diagnostics/failed_modules.txt ]; then
            echo "❌ THE FOLLOWING MODULES FAILED TO BUILD:"
            cat build-diagnostics/failed_modules.txt
            echo "========================================================"
            echo "Detailed error logs are saved in 'PayBot-Diagnostics' artifact."
            echo "All successfully built JARs have been packaged into 'PayBot-Done'."
            exit 1
          else
            echo "========================================================"
            echo "✅ ALL ACTIVE TARGETS BUILT SUCCESSFULLY!"
            echo "========================================================"
          fi
