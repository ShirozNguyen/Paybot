plugins {
    id 'dev.architectury.loom' version '1.7.435' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

subprojects {
    // v5.5.5 Part 48: loại trừ thêm module có "-26." trong tên (fabric-26.1, neoforge-26.1, ...).
    // Lý do: dev.architectury.loom 1.7.435 (khai báo ở trên) xác nhận KHÔNG chạy được với MC 26.1+
    // (GitHub issue architectury-loom#328 — crash vì cố tìm mapping trong khi 26.1+ không obfuscation
    // nên không còn mapping nào để tìm). Các module 26.x tự áp dụng plugin Loom/ModDev/ForgeGradle
    // riêng ngay trong build.gradle của chính module đó — xem fabric-26.1/build.gradle.
    //
    // v5.5.5 Part 61 (SỬA LẠI Part 57/60): loại trừ thêm fabric-1.21.10 và fabric-1.21.11.
    // Lý do gốc: lỗi build GitHub Actions thật do Shiroz gửi — "Mod was built with a newer
    // version of Loom (1.11.7), you are using Loom (1.7.435)" khi cấu hình project
    // ':fabric-1.21.10'. THỬ Part 60 (khai 'dev.architectury.loom' version khác cho riêng 2
    // module này) THẤT BẠI khi build thật — lỗi "plugin is already on the classpath with a
    // different version" — vì đây là GIỚI HẠN CỐ HỮU của Gradle: 1 plugin ID chỉ tồn tại ĐÚNG 1
    // version cho toàn bộ build, không có cách nào né được kể cả 'buildscript{}' cú pháp cũ.
    // GIẢI PHÁP ĐÚNG (Part 61): 2 module này đổi hẳn sang plugin ID KHÁC —
    // 'net.fabricmc.fabric-loom-remap' (Fabric Loom GỐC, chính chủ FabricMC, KHÔNG PHẢI fork
    // Architectury) — xác nhận chính thức qua docs.fabricmc.net: "net.fabricmc.fabric-loom-remap,
    // for obfuscated versions (Minecraft 1.21.11 or older)", tức MC 1.21.10/1.21.11 CHÍNH THỨC
    // dùng plugin ID này. Khác plugin ID = không đụng độ classpath, giống hệt nguyên lý fabric-26.1
    // (Part 48) dùng 'net.fabricmc.fabric-loom'. Xác nhận 2 module này KHÔNG phụ thuộc kiến trúc
    // multi-loader Architectury (không 'common', không '@ExpectPlatform', không dependency
    // 'dev.architectury:architectury-api') nên đổi AN TOÀN TUYỆT ĐỐI. Xem
    // fabric-1.21.10/build.gradle (Part 61) cho lý do đầy đủ + version Loom cụ thể dùng
    // ('1.17.20' — bản ổn định mới nhất của đúng dòng 'net.fabricmc.fabric-loom-remap', KHÔNG
    // liên quan gì tới bug NSME #320 của Architectury Loom vì là 2 codebase khác nhau hoàn toàn).
    // CHƯA build/test thật được lần sửa này để xác nhận 100% (cùng giới hạn sandbox không có mạng
    // Maven như các Part trước) — cần Shiroz xác nhận khi chạy CI/máy thật.
    if (project.name != 'plugin' && !project.name.contains('-26.') &&
        project.name != 'fabric-1.21.10' && project.name != 'fabric-1.21.11') {
        apply plugin: 'dev.architectury.loom'

        // v5.5.5 Part 44: mỗi module version-tách riêng tự khai báo minecraft_version của Nó
        // trong gradle.properties riêng (không dùng chung rootProject.minecraft_version nữa) —
        // đây chính là thay đổi cốt lõi để mỗi jar biên dịch/remap đúng 1 bản MC thật, không
        // còn tình trạng "biên dịch nhắm 1.20.1 nhưng chạy trên 1.21.1" như trước Part 44.
        dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            mappings loom.officialMojangMappings()
        }
    }
}

allprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.mod_group

    repositories {
        mavenCentral()
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.quiltmc.org/repository/release/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        def mc = project.hasProperty('minecraft_version') ? project.property('minecraft_version').toString() : '1.20.1'

        // v5.5.5 Part 48: thêm nhánh 26.x — trước đây chuỗi "26.1" không khớp bất kỳ điều kiện
        // nào bên dưới nên sẽ rơi xuống else -> release 17, sai hoàn toàn.
        if (mc.startsWith('26.')) {
            options.release = 25
        } else if (mc.startsWith('1.20.5') || mc.startsWith('1.20.6') || mc.startsWith('1.21')) {
            options.release = 21
        } else {
            options.release = 17
        }
    }
}

