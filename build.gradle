plugins {
    id 'dev.architectury.loom' version '1.7.435' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

subprojects {
    if (project.name != 'plugin') {
        apply plugin: 'dev.architectury.loom'

        // v5.5.5 Part 44: mÃ¡Â»â€”i module version-tÃƒÂ¡ch riÃƒÂªng tÃ¡Â»Â± khai bÃƒÂ¡o minecraft_version cÃ¡Â»Â§a NÃƒâ€œ
        // trong gradle.properties riÃƒÂªng (khÃƒÂ´ng dÃƒÂ¹ng chung rootProject.minecraft_version nÃ¡Â»Â¯a) Ã¢â‚¬â€
        // Ã„â€˜ÃƒÂ¢y chÃƒÂ­nh lÃƒÂ  thay Ã„â€˜Ã¡Â»â€¢i cÃ¡Â»â€˜t lÃƒÂµi Ã„â€˜Ã¡Â»Æ’ mÃ¡Â»â€”i jar biÃƒÂªn dÃ¡Â»â€¹ch/remap Ã„â€˜ÃƒÂºng 1 bÃ¡ÂºÂ£n MC thÃ¡ÂºÂ­t, khÃƒÂ´ng
        // cÃƒÂ²n tÃƒÂ¬nh trÃ¡ÂºÂ¡ng "biÃƒÂªn dÃ¡Â»â€¹ch nhÃ¡ÂºÂ¯m 1.20.1 nhÃ†Â°ng chÃ¡ÂºÂ¡y trÃƒÂªn 1.21.1" nhÃ†Â° trÃ†Â°Ã¡Â»â€ºc Part 44.
        dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            mappings loom.officialMojangMappings()
        }
    }
}

allprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.mod_group

    repositories {
        mavenCentral()
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.quiltmc.org/repository/release/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        def mc = project.hasProperty('minecraft_version') ? project.property('minecraft_version').toString() : '1.20.1'
        if (mc.startsWith('1.20.5') || mc.startsWith('1.20.6') || mc.startsWith('1.21')) {
            options.release = 21
        } else {
            options.release = 17
        }
    }
}

