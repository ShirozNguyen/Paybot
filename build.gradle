task copyToDone {
    subprojects.each { sp ->
        afterEvaluate {
            if (sp.tasks.findByName('remapJar')) {
                dependsOn "${sp.path}:remapJar"
            } else if (sp.tasks.findByName('jar')) {
                dependsOn "${sp.path}:jar"
            }
        }
    }

    // Dùng đường dẫn tương đối để hoạt động trên cả Windows lẫn GitHub Actions/Linux.
    def doneDir = file("$rootDir/done")

    doLast {
        delete doneDir

        def fabricDir = new File(doneDir, "Fabric_Quilt")
        def forgeDir = new File(doneDir, "Forge")
        def neoForgeDir = new File(doneDir, "NeoForge")
        def pluginsDir = new File(doneDir, "Plugins")

        fabricDir.mkdirs()
        forgeDir.mkdirs()
        neoForgeDir.mkdirs()
        pluginsDir.mkdirs()

        subprojects.each { sp ->
            def libsDir = sp.layout.buildDirectory.dir("libs").get().asFile

            if (libsDir.exists()) {
                libsDir.listFiles().each { file ->
                    if (
                        file.name.endsWith('.jar') &&
                        !file.name.endsWith('-dev.jar') &&
                        !file.name.endsWith('-shadow.jar') &&
                        !file.name.endsWith('-sources.jar')
                    ) {
                        if (sp.name.startsWith('fabric-')) {
                            copy { from file; into fabricDir }
                        } else if (sp.name.startsWith('forge-')) {
                            copy { from file; into forgeDir }
                        } else if (sp.name.startsWith('neoforge-')) {
                            copy { from file; into neoForgeDir }
                        } else if (sp.name == 'plugin') {
                            copy { from file; into pluginsDir }
                        }
                    }
                }
            }
        }
    }
}

